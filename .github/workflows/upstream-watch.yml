name: Upstream Base Watch

on:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'Asia/Tomsk'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/merge-protected-main.sh'
      - 'scripts/refresh-debian-base.sh'
      - 'scripts/refresh-linux-base.sh'
      - 'scripts/refresh-uboot-base.sh'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: atlantian-upstream-watch
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh reproducible base
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Refresh Debian snapshot
        id: debian
        run: scripts/refresh-debian-base.sh

      - name: Refresh Linux LTS patchlevel
        id: kernel
        run: scripts/refresh-linux-base.sh

      - name: Refresh U-Boot stable release
        id: uboot
        run: scripts/refresh-uboot-base.sh

      - name: Decide upstream transaction
        id: upstream
        env:
          DEBIAN_CHANGED: ${{ steps.debian.outputs.changed }}
          KERNEL_CHANGED: ${{ steps.kernel.outputs.changed }}
          UBOOT_CHANGED: ${{ steps.uboot.outputs.changed }}
        run: |
          set -euo pipefail
          changed=false; boot_changed=false
          [[ "$DEBIAN_CHANGED" == true || "$KERNEL_CHANGED" == true || "$UBOOT_CHANGED" == true ]] && changed=true
          [[ "$KERNEL_CHANGED" == true || "$UBOOT_CHANGED" == true ]] && boot_changed=true
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          echo "boot_changed=$boot_changed" >>"$GITHUB_OUTPUT"
          {
            echo '## Upstream input transaction'
            echo
            echo '| Input | Changed | Candidate |'
            echo '|---|---:|---|'
            echo "| Debian Snapshot | $DEBIAN_CHANGED | ${{ steps.debian.outputs.snapshot || 'unchanged' }} |"
            echo "| Linux LTS | $KERNEL_CHANGED | ${{ steps.kernel.outputs.version }} |"
            echo "| U-Boot stable | $UBOOT_CHANGED | ${{ steps.uboot.outputs.version }} |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Validate changed release inputs
        if: steps.upstream.outputs.changed == 'true'
        run: scripts/validate-release-inputs.sh

      - name: Install boot validation dependencies
        if: steps.upstream.outputs.boot_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf bc bison flex libssl-dev libncurses-dev \
            libelf-dev libdw-dev dwarves device-tree-compiler u-boot-tools git make \
            python3 python3-dev python3-setuptools python3-pyelftools swig

      - name: Validate Linux candidate
        if: steps.kernel.outputs.changed == 'true'
        env:
          SRC: ${{ github.workspace }}/out/watch-linux-src
        run: |
          set -euo pipefail
          scripts/build-kernel.sh config
          make -C "$SRC" -j"$(nproc)" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- zImage modules xilinx/zynq-bitmain-antminer-s9.dtb

      - name: Validate U-Boot candidate
        if: steps.uboot.outputs.changed == 'true'
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/out/uboot-watch"
          rm -rf "$work"; mkdir -p "$work"
          truncate -s 4194304 "$work/zImage"
          truncate -s 65536 "$work/devicetree.dtb"
          truncate -s 1048576 "$work/initramfs.cpio.gz"
          UBOOT_SRC="$work/source" UBOOT_BUILD="$work/sd-build" UBOOT_OUT="$work/sd-out" scripts/build-uboot.sh
          UBOOT_SRC="$work/source" UBOOT_NAND_BUILD="$work/nand-build" UBOOT_NAND_OUT="$work/nand-out" \
            ZIMAGE="$work/zImage" DTB="$work/devicetree.dtb" INITRAMFS="$work/initramfs.cpio.gz" scripts/build-uboot-nand.sh

      - name: Report Debian major availability
        if: steps.debian.outputs.major_available == 'true'
        run: echo "Debian ${{ steps.debian.outputs.candidate_major }} (${{ steps.debian.outputs.candidate_codename }}) is available; AtlANTian remains on its configured generation until an explicit transition." >>"$GITHUB_STEP_SUMMARY"

      - name: Merge changed inputs through protected main
        id: merge
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_CHANGED: ${{ steps.upstream.outputs.boot_changed }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debian-release.sha256 debian-updates-release.sha256 debian-security-release.sha256 config/debian-snapshot.env config/release.env config/u-boot.env
          git diff --cached --quiet && { echo 'watcher reported changes but produced no tracked delta' >&2; exit 1; }
          title='chore(upstream): refresh reproducible build inputs'
          git commit -m "$title"

          count=$(scripts/release-batch-state.sh HEAD)
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          urgent=$BOOT_CHANGED
          if [[ -z "$latest_tag" ]] || ! git diff --quiet "$latest_tag" -- config/release.env config/u-boot.env; then urgent=true; fi
          release_due=false
          [[ "$urgent" == true ]] || (( count >= 5 )) && release_due=true
          if [[ "$urgent" == true ]]; then release_due=true; fi

          base_sha=$GITHUB_SHA; head_sha=$(git rev-parse HEAD); branch="maintenance/upstream-base-${GITHUB_RUN_ID}"
          merge_sha=$(.github/scripts/merge-protected-main.sh "$branch" "$title" "$base_sha" "$head_sha")
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid protected merge SHA: $merge_sha" >&2; exit 1; }
          echo "merge_sha=$merge_sha" >>"$GITHUB_OUTPUT"
          echo "release_due=$release_due" >>"$GITHUB_OUTPUT"
          echo "release_input_commits=$count" >>"$GITHUB_OUTPUT"

      - name: Dispatch verified release
        if: steps.upstream.outputs.changed == 'true' && steps.merge.outputs.release_due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$EXPECTED_MAIN" ]] || { echo 'main moved after upstream merge' >&2; exit 1; }
          gh workflow run build-release.yml --ref main -f publish=true

      - name: Report deferred Debian-only release
        if: steps.upstream.outputs.changed == 'true' && steps.merge.outputs.release_due != 'true'
        run: echo "Debian-only refresh accumulated ${{ steps.merge.outputs.release_input_commits }}/5 release-input commits; publication is deferred." >>"$GITHUB_STEP_SUMMARY"

      - name: Recover missed release dispatch
        id: recovery
        if: steps.upstream.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'dispatched=false' >>"$GITHUB_OUTPUT"
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          [[ -n "$latest_tag" ]] || exit 0
          upstream_paths=(config/debian-snapshot.env debian-release.sha256 debian-updates-release.sha256 debian-security-release.sha256 config/release.env config/u-boot.env)
          git diff --quiet "$latest_tag" -- "${upstream_paths[@]}" && exit 0
          count=$(scripts/release-batch-state.sh HEAD)
          boot_delta=false; git diff --quiet "$latest_tag" -- config/release.env config/u-boot.env || boot_delta=true
          [[ "$boot_delta" == true ]] || (( count >= 5 )) || exit 0
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || { echo 'main moved before recovery dispatch' >&2; exit 1; }
          gh workflow run build-release.yml --ref main -f publish=true
          echo 'dispatched=true' >>"$GITHUB_OUTPUT"

      - name: Keep schedule active
        if: steps.upstream.outputs.changed != 'true' && steps.recovery.outputs.dispatched != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date -u +%s); last=$(git log -1 --format=%ct)
          (( now - last >= 45 * 86400 )) || exit 0
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          title='chore: keep upstream watcher active'
          git commit --allow-empty -m "$title"
          .github/scripts/merge-protected-main.sh "maintenance/upstream-heartbeat-${GITHUB_RUN_ID}" "$title" "$GITHUB_SHA" "$(git rev-parse HEAD)" >/dev/null
