name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'board/**'
      - 'config/**'
      - 'debian-*.sha256'
      - 'fpga/**'
      - 'kernel-overlay/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for explicit protected-branch validation
        required: true
        type: string
      head_sha:
        description: Head commit for explicit protected-branch validation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlantian-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid validation base SHA: $BASE_SHA" >&2; exit 64; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid validation head SHA: $HEAD_SHA" >&2; exit 64; }
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]] || { echo 'workflow_dispatch must validate the checked-out head SHA' >&2; exit 65; }
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || { echo 'validation base must be an ancestor of the dispatched head' >&2; exit 65; }
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'Changed files:\n'; printf '  %s\n' "${changed[@]}"
          actions=false; contracts=false; release_inputs=false; kernel_inputs=false
          for path in "${changed[@]}"; do
            case "$path" in .github/workflows/*|.github/dependabot.yml|.github/scripts/actions-policy.py|.github/scripts/validate-automation.py|.github/scripts/merge-protected-main.sh) actions=true ;; esac
            case "$path" in README.md|SECURITY.md|CONTRIBUTING.md|docs/*) ;; *) contracts=true ;; esac
            case "$path" in config/*|debian-*.sha256|scripts/validate-release-inputs.sh) release_inputs=true ;; esac
            case "$path" in config/release.env|config/kernel.fragment|config/kernel-prune.fragment|board/zynq-bitmain-antminer-s9.dts|kernel-overlay/*|scripts/build-kernel.sh|scripts/prepare-kernel-source.sh|scripts/refresh-linux-base.sh) kernel_inputs=true ;; esac
          done
          echo "actions=$actions" >>"$GITHUB_OUTPUT"
          echo "contracts=$contracts" >>"$GITHUB_OUTPUT"
          echo "release_inputs=$release_inputs" >>"$GITHUB_OUTPUT"
          echo "kernel_inputs=$kernel_inputs" >>"$GITHUB_OUTPUT"

      - name: Install validation dependencies
        if: steps.scope.outputs.contracts == 'true'
        run: |
          if command -v shellcheck >/dev/null && python3 -c 'import yaml' >/dev/null 2>&1; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3-yaml

      - name: Validate automation
        run: |
          python3 .github/scripts/validate-automation.py
          python3 .github/scripts/actions-policy.py scan .github/workflows

      - name: Validate documentation
        run: python3 .github/scripts/check-doc-links.py

      - name: Validate shell and source contracts
        if: steps.scope.outputs.contracts == 'true'
        run: |
          shellcheck -S error -x scripts/*.sh packaging/*/* .github/scripts/merge-protected-main.sh
          scripts/test-build-orchestration.sh
          scripts/test-runtime-policy.sh
          scripts/test-release-versioning.sh
          scripts/test-source-contracts.sh
          scripts/test-update-leds.sh
          scripts/test-release-metrics.sh

      - name: Validate release inputs
        if: steps.scope.outputs.release_inputs == 'true'
        run: scripts/validate-release-inputs.sh

      - name: Install kernel smoke dependencies
        if: steps.scope.outputs.kernel_inputs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf bc bison flex libssl-dev libelf-dev dwarves device-tree-compiler git make python3

      - name: Compile kernel smoke target
        if: steps.scope.outputs.kernel_inputs == 'true'
        env:
          SRC: ${{ github.workspace }}/out/ci-linux-src
        run: |
          set -euo pipefail
          scripts/build-kernel.sh config
          make -C "$SRC" -j"$(nproc)" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- zImage modules xilinx/zynq-bitmain-antminer-s9.dtb

      - name: Prepare Actions smoke payload
        if: steps.scope.outputs.actions == 'true'
        run: |
          mkdir -p .actions-pr-smoke
          printf 'AtlANTian Actions smoke %s\n' "$GITHUB_SHA" >.actions-pr-smoke/payload.txt

      - name: Test cache Action
        if: steps.scope.outputs.actions == 'true'
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .actions-pr-smoke
          key: atlantian-pr-actions-smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test artifact Action
        if: steps.scope.outputs.actions == 'true'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-actions-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .actions-pr-smoke/payload.txt
          retention-days: 1
