name: AtlANTian pull-request CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'board/**'
      - 'boot-candidate/**'
      - 'config/**'
      - 'debian-*.sha256'
      - 'fpga/**'
      - 'kernel-overlay/**'
      - 'scripts/**'
      - 'systemd/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate shell programs
        run: bash -n scripts/*.sh
      - name: Validate release/update contracts
        run: |
          bash scripts/test-update-leds.sh
          grep -q 'apt-get.*full-upgrade' scripts/atlantian-sysupgrade.sh
          grep -q 'SHA256SUMS' scripts/atlantian-sysupgrade.sh
          grep -q 'Type UPGRADE' scripts/atlantian-sysupgrade.sh
          grep -q -- '--check' scripts/atlantian-sysupgrade.sh
          grep -q 'command -v jq' scripts/atlantian-release-check.sh
          grep -q 'platform_name' scripts/atlantian-release-check.sh
          grep -q 'unsafe release asset name' scripts/atlantian-sysupgrade.sh
          test -s config/atlantian-releases.conf
      - name: Validate two-partition image contract
        run: |
          . config/image-layout.env
          test "$ATLANTIAN_BOOT_MIB" = 64
          test "$ATLANTIAN_INITIAL_ROOT_SLACK_MIB" -gt 0
          ! grep -q 'mmcblk0p3\|/data' scripts/make-sd-image.sh scripts/build-rootfs.sh
