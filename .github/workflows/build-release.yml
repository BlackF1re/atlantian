name: Build and release AtlANTian

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Build scope; auto detects the changed components on push.'
        required: true
        default: all
        type: choice
        options: [all, rootfs-image, kernel-image, image]
  push:
    branches: [main]
    # Documentation, README, licensing, and release-note edits do not produce
    # a new operating-system image. Every path listed here can affect the
    # booted system or the release contract.
    paths:
      - 'board/**'
      - 'boot-candidate/**'
      - 'config/**'
      - 'debian-release.sha256'
      - 'fpga/**'
      - 'kernel-overlay/**'
      - 'scripts/**'
      - 'systemd/**'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Select the smallest safe build scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          scope=all
          reason='manual full build'
          if [[ '${{ github.event_name }}' = push ]]; then
            # A force-push may intentionally replace the old tip (for
            # example while amending the single release-preparation commit).
            # That object is then absent from this shallow checkout.  A full
            # build is the only safe classification in that case.
            if git cat-file -e '${{ github.event.before }}^{commit}' 2>/dev/null; then
              changed=$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
            else
              changed='config/release.env'
              reason='previous push tip is unavailable; safe full build'
            fi
            rootfs=false kernel=false image=false
            if grep -qE '^(debian-release\.sha256|config/(release|debian-snapshot)\.env|scripts/build-incremental\.sh)$' <<<"$changed"; then
              scope=all; reason='base, release, workflow, or build-logic change'
            else
              grep -qE '^(config/packages\.base|config/atlantian-release-check\.default|fpga/|systemd/|scripts/(atlantian-|build-rootfs|configure-rootfs-access))' <<<"$changed" && rootfs=true || true
              grep -qE '^(board/|config/kernel-c41|kernel-overlay/|scripts/build-kernel\.sh)' <<<"$changed" && kernel=true || true
              grep -qE '^(boot-candidate/|scripts/(make-sd-image|make-recovery-initramfs)\.sh)' <<<"$changed" && image=true || true
              if [[ $rootfs = true && $kernel = true ]]; then
                scope=all; reason='root filesystem and kernel inputs changed together'
              elif [[ $rootfs = true ]]; then
                scope=rootfs-image; reason='root filesystem or bundled FPGA change'
              elif [[ $kernel = true ]]; then
                scope=kernel-image; reason='kernel or board-description change'
              elif [[ $image = true ]]; then
                scope=image; reason='boot, recovery, or image-assembly change'
              else
                scope=all; reason='unclassified system input'
              fi
            fi
          else
            scope='${{ inputs.scope }}'
            reason='manual selection'
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Selected \`$scope\`: $reason" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: plan
    runs-on: ubuntu-24.04
    # The native GitHub failure email links directly to the failed step. Keep
    # failure domains separate, so build, image-contract and test failures are
    # immediately distinguishable without a custom mailer.
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare immutable release identity
        id: identity
        run: |
          set -eu
          short_sha=$(git rev-parse --short=12 "$GITHUB_SHA")
          . config/release.env
          version="${DEBIAN_MAJOR}.${ATLANTIAN_BUILD}+g${short_sha}"
          release_id="atlantian-${DEBIAN_MAJOR}-${ATLANTIAN_BUILD}+g${short_sha}"
          {
            echo "ATLANTIAN_SOURCE_REVISION=$short_sha"
            echo "ATLANTIAN_VERSION=$version"
            echo "ATLANTIAN_RELEASE_ID=$release_id"
            echo "ATLANTIAN_IMAGE_NAME=$release_id"
            echo "RELEASE_TAG=v$version"
          } >> "$GITHUB_ENV"
      - name: Validate pinned release inputs
        id: pinned-inputs
        run: |
          set -euo pipefail
          . config/release.env
          . config/debian-snapshot.env
          test -n "$ATLANTIAN_KERNEL_COMMIT"
          test -n "$DEBIAN_SNAPSHOT_TIMESTAMP"
          test -s debian-release.sha256
          curl -fsSL "$DEBIAN_SNAPSHOT_MIRROR/dists/$DEBIAN_CODENAME/Release" -o /tmp/debian-release
          test "$(sha256sum /tmp/debian-release | awk '{print $1}')" = "$(tr -d '\\r\\n' < debian-release.sha256)"
          curl -fsSL "$DEBIAN_SNAPSHOT_MIRROR/dists/${DEBIAN_CODENAME}-updates/Release" -o /tmp/debian-updates-release
          test "$(sha256sum /tmp/debian-updates-release | awk '{print $1}')" = "$(tr -d '\\r\\n' < debian-updates-release.sha256)"
          curl -fsSL "$DEBIAN_SECURITY_SNAPSHOT_MIRROR/dists/${DEBIAN_CODENAME}-security/Release" -o /tmp/debian-security-release
          test "$(sha256sum /tmp/debian-security-release | awk '{print $1}')" = "$(tr -d '\\r\\n' < debian-security-release.sha256)"
      - name: Install cross-build dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses-dev device-tree-compiler \
            u-boot-tools kmod cpio rsync pigz xz-utils e2fsprogs dosfstools parted \
            libelf-dev libdw-dev git curl ca-certificates sudo
      - name: Restore Linux source and build cache
        id: kernel-cache
        # v4.2.3
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: out/linux-src
          # Debian metadata is deliberately part of the key: when Debian
          # changes, the release is a clean full rebuild, including kernel.
          # Otherwise this tree is reusable only when every kernel input is
          # byte-for-byte identical.
          key: linux-6.12.100-${{ hashFiles('debian-release.sha256', 'config/release.env', 'board/**', 'config/kernel-c41*.fragment', 'kernel-overlay/**', 'scripts/build-kernel.sh') }}
      - name: Restore root filesystem cache
        id: rootfs-cache
        # v4.2.3
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: out/rootfs
          # Kernel modules are replaced by build-kernel.sh when the kernel
          # changes, so the base rootfs cache deliberately tracks only inputs
          # which affect rootfs construction itself.
          key: rootfs-${{ hashFiles('debian-release.sha256', 'config/debian-snapshot.env', 'config/packages.base', 'config/atlantian-release-check.default', 'fpga/**', 'systemd/**', 'scripts/atlantian-*.sh', 'scripts/build-rootfs.sh', 'scripts/configure-rootfs-access.sh') }}
      - name: Restore boot artefacts
        id: boot-cache
        # v4.2.3
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: out/boot
          key: boot-6.12.100-${{ hashFiles('debian-release.sha256', 'config/release.env', 'board/**', 'config/kernel-c41*.fragment', 'kernel-overlay/**', 'scripts/build-kernel.sh') }}
      - name: Fetch pinned Linux source
        id: kernel-source
        run: |
          set -eu
          mkdir -p out
          . config/release.env
          if [ ! -d out/linux-src/.git ]; then
            git init out/linux-src
            git -C out/linux-src remote add origin https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          fi
          git -C out/linux-src fetch --depth 1 origin "$ATLANTIAN_KERNEL_COMMIT"
          git -C out/linux-src checkout --detach FETCH_HEAD
          test "$(git -C out/linux-src rev-parse HEAD)" = "$ATLANTIAN_KERNEL_COMMIT"
      - name: Build the selected release scope
        id: build
        env:
          DEBIAN_FRONTEND: noninteractive
          JOBS: 2
        run: |
          scope='${{ needs.plan.outputs.scope }}'
          # A cache eviction must never produce a partial release. A rootfs
          # change builds both its own rootfs and the kernel; a kernel change
          # builds fresh boot artefacts but needs the cached rootfs as the
          # modules-install destination. Image-only work needs both caches.
          case "$scope" in
            kernel-image)
              [[ -d out/rootfs ]] || { echo 'Rootfs cache unavailable; using a complete build.'; scope=all; }
              ;;
            image)
              [[ -d out/rootfs && -f out/boot/zImage && -f out/boot/devicetree.dtb ]] || {
                echo 'Rootfs or boot cache unavailable; using a complete build.'; scope=all;
              }
              ;;
          esac
          echo "Scope: $scope (${{ needs.plan.outputs.reason }})"
          sudo ./scripts/build-incremental.sh "$scope"
          sudo chown -R "$USER:$USER" out artifacts
      - name: Verify release artifacts
        id: artifact-check
        run: |
          image=$(find artifacts/current -maxdepth 1 -name '*.img' -type f | head -n1)
          payload=$(find artifacts/current -maxdepth 1 -name '*.system.ext4' -type f | head -n1)
          boot=$(find artifacts/current -maxdepth 1 -name '*.boot.vfat' -type f | head -n1)
          bundle=$(find artifacts/current -maxdepth 1 -name '*.update.bundle' -type f | head -n1)
          test -n "$image" -a -n "$payload" -a -n "$boot" -a -n "$bundle"
          bash scripts/test-build.sh "$image" "$payload" artifacts/current/SHA256SUMS
          sudo bash scripts/test-image-layout.sh "$image"
          test -s "${payload%.ext4}.packages.tsv"
          test -s "${payload%.ext4}.snapshot.txt"
      - name: Validate shell programs
        id: shell-check
        run: |
          bash -n scripts/*.sh
      - name: Verify update-state contract
        id: update-check
        run: |
          bash scripts/test-update-leds.sh
      - name: Verify persistent-state contract
        id: persistence-check
        run: |
          set -euo pipefail
          bash scripts/test-persistent-state.sh
      - name: Publish CI outcome summary
        if: always()
        run: |
          {
            echo '## AtlANTian CI outcome'
            echo
            echo '| Domain | Outcome |'
            echo '|---|---|'
            echo '| Dependencies | ${{ steps.dependencies.outcome }} |'
            echo '| Kernel source/cache | ${{ steps.kernel-source.outcome }} (cache: ${{ steps.kernel-cache.outputs.cache-hit }}) |'
            echo '| Build | ${{ steps.build.outcome }} |'
            echo '| Artifact, partition and rootfs contracts | ${{ steps.artifact-check.outcome }} |'
            echo '| Shell syntax | ${{ steps.shell-check.outcome }} |'
            echo '| Update-state contract | ${{ steps.update-check.outcome }} |'
            echo '| Persistent-state contract | ${{ steps.persistence-check.outcome }} |'
            echo
            echo 'The GitHub notification links to this run; the first failed named step is the failure class.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate concise release notes
        run: bash scripts/generate-release-notes.sh "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Verify release identity
        run: |
          test "$RELEASE_TAG" = "v$ATLANTIAN_VERSION"
          test -f "artifacts/current/$ATLANTIAN_IMAGE_NAME.img"
          test -f "artifacts/current/$ATLANTIAN_IMAGE_NAME.system.ext4"
          test -f "artifacts/current/$ATLANTIAN_IMAGE_NAME.boot.vfat"
          test -f "artifacts/current/$ATLANTIAN_IMAGE_NAME.update.bundle"
      - name: Write build metadata
        run: |
          . config/release.env
          {
            echo "AtlANTian GNU/Linux $ATLANTIAN_VERSION"
            echo "Release tag: $RELEASE_TAG"
            echo "Source commit: $GITHUB_SHA"
            echo "Debian base: $DEBIAN_CODENAME"
            echo "Debian snapshot: $(sed -n 's/^DEBIAN_SNAPSHOT_TIMESTAMP=//p' config/debian-snapshot.env)"
            echo "Debian Release SHA-256: $(cat debian-release.sha256)"
            echo "Package manifest SHA-256: $(sha256sum artifacts/current/*.packages.tsv | awk '{print $1}')"
            echo "Linux kernel: $ATLANTIAN_KERNEL_VERSION$ATLANTIAN_KERNEL_LOCALVERSION"
            echo "Build workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > artifacts/current/BUILD-INFO.txt
      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlantian-image-${{ env.ATLANTIAN_VERSION }}
          path: |
            artifacts/current/*.img
            artifacts/current/*.boot.vfat
            artifacts/current/*.update.bundle
            artifacts/current/*.system.ext4
            artifacts/current/*.packages.tsv
            artifacts/current/*.snapshot.txt
            artifacts/current/SHA256SUMS
            artifacts/current/BUILD-INFO.txt
      - name: Publish GitHub release
        # v2.2.2
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AtlANTian GNU/Linux ${{ env.ATLANTIAN_VERSION }}
          body_path: release-notes.md
          files: |
            artifacts/current/*.img
            artifacts/current/*.boot.vfat
            artifacts/current/*.update.bundle
            artifacts/current/*.system.ext4
            artifacts/current/*.packages.tsv
            artifacts/current/*.snapshot.txt
            artifacts/current/SHA256SUMS
            artifacts/current/BUILD-INFO.txt
