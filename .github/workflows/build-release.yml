name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this AtlANTian build
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'config/**'
      - 'debian-*.sha256'
      - 'fpga/**'
      - 'kernel-overlay/**'
      - 'packaging/**'
      - 'scripts/**'
      - '!scripts/generate-release-notes.sh'
      - 'systemd/**'

permissions:
  contents: read

concurrency:
  group: atlantian-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLANTIAN_GITHUB_REPO: ${{ github.repository }}

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      publish_requested: ${{ steps.plan.outputs.publish_requested }}
      build_required: ${{ steps.plan.outputs.build_required }}
      already_published: ${{ steps.plan.outputs.already_published }}
      reuse_run_id: ${{ steps.plan.outputs.reuse_run_id }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      version: ${{ steps.auto_version.outputs.version }}
      patch: ${{ steps.auto_version.outputs.patch }}
      prerelease: ${{ steps.auto_version.outputs.prerelease }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve automatic release version
        id: auto_version
        shell: bash
        run: bash scripts/resolve-release-version.sh "$GITHUB_SHA"

      - name: Plan verified build and publication
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_PUSH: ${{ github.event_name == 'push' }}
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          . config/release.env
          artifact_name="atlantian-verified-${GITHUB_SHA}"
          build_required=true
          publish_requested=false
          already_published=false
          reuse_run_id=""

          if [[ "$MANUAL_PUBLICATION" == true ]]; then
            publish_requested=true
          elif [[ "$AUTOMATIC_PUSH" == true ]]; then
            release_input_commits=$(scripts/release-batch-state.sh "$GITHUB_SHA")
            if (( release_input_commits >= 5 )); then
              publish_requested=true
            else
              build_required=false
              echo "Deferring release build: ${release_input_commits}/5 release-input commits since the last release."
            fi
          fi

          if [[ "$publish_requested" == true ]]; then
            release_tag="v$ATLANTIAN_VERSION"
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha 2>/dev/null) || tag_commit=""
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
              already_published=true
              build_required=false
              echo "Release $release_tag already exists for this exact source."
            else
              reuse_run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$artifact_name" -f per_page=100 \
                --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == env.GITHUB_SHA)] | sort_by(.created_at) | last | .workflow_run.id // empty')
              if [[ -n "$reuse_run_id" ]]; then
                build_required=false
                echo "Reusing verified artifact $artifact_name from workflow run $reuse_run_id."
              else
                echo "No reusable verified artifact exists for $GITHUB_SHA; a full build is required."
              fi
            fi
          fi

          {
            echo "publish_requested=$publish_requested"
            echo "build_required=$build_required"
            echo "already_published=$already_published"
            echo "reuse_run_id=$reuse_run_id"
            echo "artifact_name=$artifact_name"
          } >>"$GITHUB_OUTPUT"
          {
            echo '## AtlANTian release plan'
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Version | $ATLANTIAN_VERSION |"
            echo "| Release-input commits since last release | ${release_input_commits:-manual} |"
            echo "| Publish requested | $publish_requested |"
            echo "| Build required | $build_required |"
            echo "| Already published | $already_published |"
            echo "| Reusable workflow run | ${reuse_run_id:-none} |"
          } >>"$GITHUB_STEP_SUMMARY"

  preflight:
    name: Validate source
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          export ATLANTIAN_SOURCE_REVISION
          ATLANTIAN_SOURCE_REVISION=$(git rev-parse --short=12 "$GITHUB_SHA")
          . config/release.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"

      - name: Validate source contracts
        run: |
          set -euo pipefail
          scripts/test-build-orchestration.sh
          scripts/test-runtime-policy.sh
          scripts/test-source-contracts.sh
          scripts/test-update-leds.sh
          scripts/test-release-metrics.sh

      - name: Validate release inputs
        run: scripts/validate-release-inputs.sh

  rootfs:
    name: Build rootfs
    needs: [plan, preflight]
    outputs:
      handoff_sha256: ${{ steps.handoff.outputs.sha256 }}
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      DEBIAN_FRONTEND: noninteractive
      ATLANTIAN_DEBOOTSTRAP_CACHE: ${{ github.workspace }}/.cache/debootstrap
      ATLANTIAN_SKIP_PREFLIGHT: '1'
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse --short=12 "$GITHUB_SHA")
          echo "ATLANTIAN_SOURCE_REVISION=$revision" >>"$GITHUB_ENV"
          export ATLANTIAN_SOURCE_REVISION=$revision
          . config/release.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"

      - name: Install rootfs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support \
            cpio rsync xz-utils zstd jq \
            git curl ca-certificates sudo

      - name: Build SD and NAND root filesystems
        run: sudo -E ./scripts/build-incremental.sh rootfs

      - name: Verify source tree integrity
        run: git diff --exit-code

      - name: Pack rootfs handoff
        id: handoff
        run: |
          set -euo pipefail
          mkdir -p handoff
          sudo tar --acls --xattrs --xattrs-include='*' --numeric-owner \
            -I 'zstd -T0 -3' -C out \
            -cf handoff/rootfs-state.tar.zst rootfs rootfs-nand build-tools
          sudo chown "$USER:$USER" handoff/rootfs-state.tar.zst
          echo "sha256=$(sha256sum handoff/rootfs-state.tar.zst | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Upload rootfs handoff
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlantian-rootfs-state
          path: handoff/rootfs-state.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  kernel:
    name: Build Linux kernel
    needs: [plan, preflight]
    outputs:
      handoff_sha256: ${{ steps.handoff.outputs.sha256 }}
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      ATLANTIAN_SKIP_PREFLIGHT: '1'
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        id: identity
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse --short=12 "$GITHUB_SHA")
          echo "ATLANTIAN_SOURCE_REVISION=$revision" >>"$GITHUB_ENV"
          export ATLANTIAN_SOURCE_REVISION=$revision
          . config/release.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"
          echo "kernel_commit=$ATLANTIAN_KERNEL_COMMIT" >>"$GITHUB_OUTPUT"

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses-dev device-tree-compiler \
            kmod libelf-dev libdw-dev zstd \
            git ca-certificates sudo python3 python3-pyelftools

      - name: Build Linux kernel and modules
        run: sudo -E ./scripts/build-incremental.sh kernel

      - name: Verify source tree integrity
        run: git diff --exit-code

      - name: Pack kernel handoff
        id: handoff
        run: |
          set -euo pipefail
          mkdir -p handoff
          sudo tar --acls --xattrs --xattrs-include='*' --numeric-owner \
            -I 'zstd -T0 -3' -C out \
            -cf handoff/kernel-state.tar.zst kernel-rootfs boot
          sudo chown "$USER:$USER" handoff/kernel-state.tar.zst
          echo "sha256=$(sha256sum handoff/kernel-state.tar.zst | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Upload kernel handoff
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlantian-kernel-state
          path: handoff/kernel-state.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  assemble:
    name: Assemble release
    needs: [plan, rootfs, kernel]
    outputs:
      candidate_sha256: ${{ steps.candidate.outputs.sha256 }}
      rebase_sha256: ${{ steps.rebase.outputs.sha256 }}
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      ATLANTIAN_SKIP_PREFLIGHT: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        id: identity
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse --short=12 "$GITHUB_SHA")
          echo "ATLANTIAN_SOURCE_REVISION=$revision" >>"$GITHUB_ENV"
          export ATLANTIAN_SOURCE_REVISION=$revision
          . config/release.env
          . config/u-boot.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"
          {
            echo "ATLANTIAN_VERSION=$ATLANTIAN_VERSION"
            echo "ATLANTIAN_IMAGE_NAME=$ATLANTIAN_IMAGE_NAME"
          } >>"$GITHUB_ENV"
          echo "uboot_commit=$ATLANTIAN_UBOOT_COMMIT" >>"$GITHUB_OUTPUT"

      - name: Install artifact build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses-dev device-tree-compiler \
            u-boot-tools kmod cpio rsync pigz xz-utils zstd e2fsprogs dosfstools parted \
            mtd-utils squashfs-tools jq \
            libelf-dev libdw-dev git curl ca-certificates sudo \
            python3 python3-dev python3-setuptools python3-pyelftools swig

      - name: Download build handoffs
        run: |
          set -euo pipefail
          mkdir -p handoff/rootfs handoff/kernel
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-rootfs-state --dir handoff/rootfs
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-kernel-state --dir handoff/kernel

      - name: Verify and restore build state
        env:
          ROOTFS_SHA256: ${{ needs.rootfs.outputs.handoff_sha256 }}
          KERNEL_SHA256: ${{ needs.kernel.outputs.handoff_sha256 }}
        run: |
          set -euo pipefail
          [[ $ROOTFS_SHA256 =~ ^[0-9a-f]{64}$ && $KERNEL_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$ROOTFS_SHA256" handoff/rootfs/rootfs-state.tar.zst | sha256sum -c -
          printf '%s  %s\n' "$KERNEL_SHA256" handoff/kernel/kernel-state.tar.zst | sha256sum -c -
          rootfs_restore="$RUNNER_TEMP/atlantian-rootfs-state"
          kernel_restore="$RUNNER_TEMP/atlantian-kernel-state"
          rm -rf "$rootfs_restore" "$kernel_restore"
          mkdir -p "$rootfs_restore" "$kernel_restore" out
          sudo tar --acls --xattrs --xattrs-include='*' --numeric-owner --same-owner \
            -I zstd -C "$rootfs_restore" -xf handoff/rootfs/rootfs-state.tar.zst
          sudo tar --acls --xattrs --xattrs-include='*' --numeric-owner --same-owner \
            -I zstd -C "$kernel_restore" -xf handoff/kernel/kernel-state.tar.zst
          for name in rootfs rootfs-nand build-tools; do
            [[ -d "$rootfs_restore/$name" && ! -L "$rootfs_restore/$name" ]] || { echo "invalid rootfs handoff member: $name" >&2; exit 1; }
            sudo rm -rf "out/$name"
            sudo mv "$rootfs_restore/$name" "out/$name"
          done
          for name in kernel-rootfs boot; do
            [[ -d "$kernel_restore/$name" && ! -L "$kernel_restore/$name" ]] || { echo "invalid kernel handoff member: $name" >&2; exit 1; }
            sudo rm -rf "out/$name"
            sudo mv "$kernel_restore/$name" "out/$name"
          done

      - name: Build release artifacts
        run: sudo -E ./scripts/build-incremental.sh artifacts

      - name: Verify source tree integrity
        run: git diff --exit-code

      - name: Prepare trusted validation handoffs
        id: rebase
        run: |
          set -euo pipefail
          mkdir -p artifacts/current/.ci handoff
          install -m 0644 out/bootloader/nand/raw-boot-sizes.env artifacts/current/.ci/raw-boot-sizes.env
          sudo tar --acls --xattrs --xattrs-include='*' --numeric-owner \
            -I 'zstd -T0 -3' -C out \
            -cf handoff/rootfs-nand-state.tar.zst rootfs-nand
          sudo chown "$USER:$USER" handoff/rootfs-nand-state.tar.zst
          echo "sha256=$(sha256sum handoff/rootfs-nand-state.tar.zst | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Pack release candidate
        id: candidate
        run: |
          set -euo pipefail
          sudo tar --numeric-owner -I 'zstd -T0 -3' \
            -cf handoff/release-candidate.tar.zst artifacts/current
          sudo chown "$USER:$USER" handoff/release-candidate.tar.zst
          echo "sha256=$(sha256sum handoff/release-candidate.tar.zst | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Upload release candidate
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlantian-release-candidate
          path: handoff/release-candidate.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload NAND rebase state
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlantian-nand-rebase-state
          path: handoff/rootfs-nand-state.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  validate_artifacts:
    name: Validate release artifacts
    needs: [plan, assemble]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fdisk xz-utils zstd

      - name: Download and verify release candidate
        env:
          CANDIDATE_SHA256: ${{ needs.assemble.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-release-candidate --dir handoff
          [[ $CANDIDATE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CANDIDATE_SHA256" handoff/release-candidate.tar.zst | sha256sum -c -
          candidate_root="$RUNNER_TEMP/atlantian-release-candidate"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"
          tar -I zstd -C "$candidate_root" -xf handoff/release-candidate.tar.zst
          [[ -d "$candidate_root/artifacts/current" && ! -L "$candidate_root/artifacts/current" ]]
          echo "ATLANTIAN_CANDIDATE_DIR=$candidate_root/artifacts/current" >>"$GITHUB_ENV"

      - name: Validate release inventory and metadata
        run: scripts/test-release-artifacts.sh "$ATLANTIAN_CANDIDATE_DIR"

  validate_sd:
    name: Validate SD image
    needs: [plan, assemble]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install SD validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fdisk util-linux u-boot-tools device-tree-compiler binutils zstd

      - name: Download and verify release candidate
        env:
          CANDIDATE_SHA256: ${{ needs.assemble.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-release-candidate --dir handoff
          [[ $CANDIDATE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CANDIDATE_SHA256" handoff/release-candidate.tar.zst | sha256sum -c -
          candidate_root="$RUNNER_TEMP/atlantian-release-candidate"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"
          tar -I zstd -C "$candidate_root" -xf handoff/release-candidate.tar.zst
          [[ -d "$candidate_root/artifacts/current" && ! -L "$candidate_root/artifacts/current" ]]
          echo "ATLANTIAN_CANDIDATE_DIR=$candidate_root/artifacts/current" >>"$GITHUB_ENV"

      - name: Validate SD image layout
        run: |
          set -euo pipefail
          . config/release.env
          sudo -E ./scripts/test-image-layout.sh "$ATLANTIAN_CANDIDATE_DIR/$ATLANTIAN_IMAGE_NAME.img"

  validate_nand:
    name: Validate NAND bundle
    needs: [plan, assemble]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install NAND validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fdisk util-linux u-boot-tools device-tree-compiler binutils zstd

      - name: Download and verify NAND validation inputs
        env:
          CANDIDATE_SHA256: ${{ needs.assemble.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-release-candidate --dir handoff
          [[ $CANDIDATE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CANDIDATE_SHA256" handoff/release-candidate.tar.zst | sha256sum -c -
          candidate_root="$RUNNER_TEMP/atlantian-release-candidate"
          bundle_root="$RUNNER_TEMP/atlantian-nand-bundle"
          rm -rf "$candidate_root" "$bundle_root"
          mkdir -p "$candidate_root" "$bundle_root"
          tar -I zstd -C "$candidate_root" -xf handoff/release-candidate.tar.zst
          candidate_dir="$candidate_root/artifacts/current"
          [[ -d "$candidate_dir" && ! -L "$candidate_dir" ]]
          . config/release.env
          tar -I zstd -C "$bundle_root" -xf "$candidate_dir/atlantian-nand-$ATLANTIAN_VERSION.tar.zst"
          raw_sizes="$RUNNER_TEMP/atlantian-raw-boot-sizes.env"
          install -m 0644 "$candidate_dir/.ci/raw-boot-sizes.env" "$raw_sizes"
          {
            echo "ATLANTIAN_CANDIDATE_DIR=$candidate_dir"
            echo "ATLANTIAN_NAND_BUNDLE_DIR=$bundle_root"
            echo "ATLANTIAN_RAW_BOOT_SIZES=$raw_sizes"
          } >>"$GITHUB_ENV"

      - name: Validate NAND bundle and embedded payload
        run: |
          set -euo pipefail
          . config/release.env
          RAW_BOOT_SIZES="$ATLANTIAN_RAW_BOOT_SIZES" scripts/test-nand-artifacts.sh "$ATLANTIAN_NAND_BUNDLE_DIR" "$ATLANTIAN_CANDIDATE_DIR/$ATLANTIAN_IMAGE_NAME.img"

  sd_upgrade:
    name: Test SD upgrade
    needs: [plan, assemble]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install upgrade-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq parted e2fsprogs qemu-user-static binfmt-support zstd

      - name: Download and verify upgrade candidate
        env:
          CANDIDATE_SHA256: ${{ needs.assemble.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-release-candidate --dir handoff
          [[ $CANDIDATE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CANDIDATE_SHA256" handoff/release-candidate.tar.zst | sha256sum -c -
          candidate_root="$RUNNER_TEMP/atlantian-release-candidate"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"
          tar -I zstd -C "$candidate_root" -xf handoff/release-candidate.tar.zst
          [[ -d "$candidate_root/artifacts/current" && ! -L "$candidate_root/artifacts/current" ]]
          echo "ATLANTIAN_CANDIDATE_DIR=$candidate_root/artifacts/current" >>"$GITHUB_ENV"

      - name: Test cross-release SD upgrade
        run: sudo -E ./scripts/test-release-upgrade.sh "$ATLANTIAN_CANDIDATE_DIR"

  nand_rebase:
    name: Test NAND rebase
    needs: [plan, assemble]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install NAND rebase dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support rsync zstd
          sudo update-binfmts --enable qemu-arm

      - name: Download and verify NAND rebase state
        env:
          REBASE_SHA256: ${{ needs.assemble.outputs.rebase_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-nand-rebase-state --dir handoff
          [[ $REBASE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$REBASE_SHA256" handoff/rootfs-nand-state.tar.zst | sha256sum -c -
          rebase_root="$RUNNER_TEMP/atlantian-nand-rebase-state"
          rm -rf "$rebase_root"
          mkdir -p "$rebase_root"
          sudo tar --acls --xattrs --xattrs-include='*' --numeric-owner --same-owner \
            -I zstd -C "$rebase_root" -xf handoff/rootfs-nand-state.tar.zst
          [[ -d "$rebase_root/rootfs-nand" && ! -L "$rebase_root/rootfs-nand" ]]
          echo "ATLANTIAN_NAND_REBASE_ROOT=$rebase_root/rootfs-nand" >>"$GITHUB_ENV"

      - name: Test NAND persistent-state rebase
        run: sudo -E ./scripts/test-nand-rebase.sh "$ATLANTIAN_NAND_REBASE_ROOT"

  seal:
    name: Seal verified build
    needs: [plan, assemble, validate_artifacts, validate_sd, validate_nand, sd_upgrade, nand_rebase]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse --short=12 "$GITHUB_SHA")
          export ATLANTIAN_SOURCE_REVISION=$revision
          . config/release.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"
          {
            echo "ATLANTIAN_SOURCE_REVISION=$revision"
            echo "ATLANTIAN_VERSION=$ATLANTIAN_VERSION"
          } >>"$GITHUB_ENV"

      - name: Install seal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Download and verify release candidate
        env:
          CANDIDATE_SHA256: ${{ needs.assemble.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name atlantian-release-candidate --dir handoff
          [[ $CANDIDATE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CANDIDATE_SHA256" handoff/release-candidate.tar.zst | sha256sum -c -
          candidate_root="$RUNNER_TEMP/atlantian-release-candidate"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"
          tar -I zstd -C "$candidate_root" -xf handoff/release-candidate.tar.zst
          [[ -d "$candidate_root/artifacts/current" && ! -L "$candidate_root/artifacts/current" ]]
          echo "ATLANTIAN_CANDIDATE_DIR=$candidate_root/artifacts/current" >>"$GITHUB_ENV"

      - name: Seal verified artifact
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" >"$ATLANTIAN_CANDIDATE_DIR/VERIFIED-SOURCE-SHA"
          printf '%s\n' "$ATLANTIAN_VERSION" >"$ATLANTIAN_CANDIDATE_DIR/VERIFIED-VERSION"
          (cd "$ATLANTIAN_CANDIDATE_DIR" && sha256sum -c SHA256SUMS)

      - name: Attest verified build
        # v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/SHA256SUMS

      - name: Upload verified artifact
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          path: |
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/*.img
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/*.img.xz
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/*.tar.zst
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/*.deb
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/*.packages.tsv
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/*.snapshot.txt
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/RELEASE-METADATA.json
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/SHA256SUMS
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/VERIFIED-SOURCE-SHA
            ${{ runner.temp }}/atlantian-release-candidate/artifacts/current/VERIFIED-VERSION

      - name: Write verification summary
        if: always()
        run: |
          {
            echo '## AtlANTian verified build'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo '| Release artifacts | ${{ needs.validate_artifacts.result }} |'
            echo '| SD image | ${{ needs.validate_sd.result }} |'
            echo '| NAND bundle | ${{ needs.validate_nand.result }} |'
            echo '| SD upgrade | ${{ needs.sd_upgrade.result }} |'
            echo '| NAND rebase | ${{ needs.nand_rebase.result }} |'
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [plan, seal]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.publish_requested == 'true' &&
      (
        (needs.plan.outputs.build_required == 'true' && needs.seal.result == 'success') ||
        (needs.plan.outputs.build_required != 'true' && needs.seal.result == 'skipped')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          export ATLANTIAN_SOURCE_REVISION
          ATLANTIAN_SOURCE_REVISION=$(git rev-parse --short=12 "$GITHUB_SHA")
          . config/release.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"
          test "$ATLANTIAN_IMAGE_NAME" = "$ATLANTIAN_RELEASE_ID"
          {
            echo "ATLANTIAN_SOURCE_REVISION=$ATLANTIAN_SOURCE_REVISION"
            echo "ATLANTIAN_SOURCE_ID=$ATLANTIAN_SOURCE_ID"
            echo "ATLANTIAN_VERSION=$ATLANTIAN_VERSION"
            echo "ATLANTIAN_DEB_VERSION=$ATLANTIAN_DEB_VERSION"
            echo "ATLANTIAN_PRERELEASE=$ATLANTIAN_PRERELEASE"
            echo "ATLANTIAN_RELEASE_ID=$ATLANTIAN_RELEASE_ID"
            echo "ATLANTIAN_IMAGE_NAME=$ATLANTIAN_IMAGE_NAME"
            echo "RELEASE_TAG=v$ATLANTIAN_VERSION"
          } >>"$GITHUB_ENV"

      - name: Check publication eligibility
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          ALREADY_PUBLISHED: ${{ needs.plan.outputs.already_published }}
        run: |
          set -euo pipefail
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""
          if [[ "$ALREADY_PUBLISHED" = true ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
              echo 'publish=false' >>"$GITHUB_OUTPUT"; exit 0
            fi
            echo "Previously detected release $RELEASE_TAG disappeared or moved." >&2; exit 1
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'publish=false' >>"$GITHUB_OUTPUT"
            echo 'This build was superseded by a newer main commit.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$tag_commit" = "$GITHUB_SHA" ]] && { echo 'publish=false' >>"$GITHUB_OUTPUT"; exit 0; }
            echo "Release $RELEASE_TAG belongs to another source revision." >&2; exit 1
          fi
          [[ -z "$tag_commit" || "$tag_commit" = "$GITHUB_SHA" ]] || { echo "Tag $RELEASE_TAG already points to $tag_commit." >&2; exit 1; }
          echo 'publish=true' >>"$GITHUB_OUTPUT"

      - name: Download verified artifact
        id: artifact_source
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ needs.plan.outputs.reuse_run_id }}
          ARTIFACT_NAME: ${{ needs.plan.outputs.artifact_name }}
        run: |
          set -euo pipefail
          source_run=${REUSE_RUN_ID:-$GITHUB_RUN_ID}
          rm -rf artifacts/current; mkdir -p artifacts/current
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir artifacts/current
          echo "run_id=$source_run" >>"$GITHUB_OUTPUT"

      - name: Verify publication payload
        if: steps.publication.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test "$(cat artifacts/current/VERIFIED-SOURCE-SHA)" = "$GITHUB_SHA"
          test "$(cat artifacts/current/VERIFIED-VERSION)" = "$ATLANTIAN_VERSION"
          test "$RELEASE_TAG" = "v$ATLANTIAN_VERSION"
          test -s "artifacts/current/$ATLANTIAN_IMAGE_NAME.img"
          test -s "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz"
          test -s "artifacts/current/atlantian-nand-$ATLANTIAN_VERSION.tar.zst"
          test "$(find artifacts/current -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 3
          xz -t "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz"
          test "$(xz -dc "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz" | sha256sum | awk '{print $1}')" = "$(sha256sum "artifacts/current/$ATLANTIAN_IMAGE_NAME.img" | awk '{print $1}')"
          (cd artifacts/current && sha256sum -c SHA256SUMS)

      - name: Preserve verified checksum manifest
        if: steps.publication.outputs.publish == 'true'
        run: cp artifacts/current/SHA256SUMS "$RUNNER_TEMP/atlantian-verified-SHA256SUMS"

      - name: Prepare public release payload
        if: steps.publication.outputs.publish == 'true'
        run: scripts/prepare-public-release.sh artifacts/current

      - name: Generate release notes
        if: steps.publication.outputs.publish == 'true'
        run: scripts/generate-release-notes.sh "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Publish GitHub release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=(
            "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz"
            artifacts/current/atlantian-kernel_*.deb
            "artifacts/current/atlantian-nand-$ATLANTIAN_VERSION.tar.zst"
            artifacts/current/atlantian-platform_*.deb
            artifacts/current/atlantian-release_*.deb
            artifacts/current/atlantian-update.json
            artifacts/current/RELEASE-METADATA.json
            artifacts/current/SHA256SUMS
          )
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$tag_commit" = "$GITHUB_SHA" ]] && exit 0
            echo "Release $RELEASE_TAG appeared for another source revision." >&2; exit 1
          fi
          [[ -z "$tag_commit" || "$tag_commit" = "$GITHUB_SHA" ]] || { echo "Tag $RELEASE_TAG moved to $tag_commit." >&2; exit 1; }
          prerelease=(); [[ -z "$ATLANTIAN_PRERELEASE" ]] || prerelease+=(--prerelease)
          if ! gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AtlANTian GNU/Linux $ATLANTIAN_VERSION" --notes-file release-notes.md "${prerelease[@]}" "${release_assets[@]}"; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""
              [[ "$tag_commit" = "$GITHUB_SHA" ]] && exit 0
            fi
            exit 1
          fi

      - name: Prepare compact upgrade artifact
        if: steps.publication.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/atlantian-verified-SHA256SUMS" artifacts/current/SHA256SUMS
          test "$(cat artifacts/current/VERIFIED-SOURCE-SHA)" = "$GITHUB_SHA"
          test "$(cat artifacts/current/VERIFIED-VERSION)" = "$ATLANTIAN_VERSION"
          image="artifacts/current/$ATLANTIAN_IMAGE_NAME.img"
          expected=$(awk -v name="$ATLANTIAN_IMAGE_NAME.img" '$2 == name || $2 == "*" name { print $1; exit }' artifacts/current/SHA256SUMS)
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$image" | awk '{print $1}')" = "$expected"

      - name: Compact published verified artifact
        id: compact_artifact
        if: steps.publication.outputs.publish == 'true'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          path: |
            artifacts/current/*.img
            artifacts/current/RELEASE-METADATA.json
            artifacts/current/SHA256SUMS
            artifacts/current/VERIFIED-SOURCE-SHA
            artifacts/current/VERIFIED-VERSION

      - name: Write publication summary
        if: always()
        run: |
          {
            echo '## AtlANTian publication'
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo '| Version | ${{ needs.plan.outputs.version }} |'
            echo '| Verification job | ${{ needs.seal.result }} |'
            echo '| Reused workflow run | ${{ needs.plan.outputs.reuse_run_id || 'none' }} |'
            echo '| Artifact source run | ${{ steps.artifact_source.outputs.run_id || 'none' }} |'
            echo '| Publication eligible | ${{ steps.publication.outputs.publish }} |'
            echo '| Compact upgrade artifact | ${{ steps.compact_artifact.outcome || 'skipped' }} |'
          } >>"$GITHUB_STEP_SUMMARY"
