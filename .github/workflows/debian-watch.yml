name: Watch Debian base updates

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Debian Release metadata
        id: debian
        run: |
          set -eu
          curl -fsSL https://deb.debian.org/debian/dists/trixie/Release -o /tmp/debian-release
          sha256sum /tmp/debian-release | cut -d' ' -f1 > debian-release.sha256
          if git show HEAD:debian-release.sha256 > /tmp/old 2>/dev/null && cmp -s debian-release.sha256 /tmp/old; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Record metadata and start build
        if: steps.debian.outputs.changed == 'true'
        run: |
          set -eu
          . config/release.env
          next_build=$((ATLANTIAN_BUILD + 1))
          sed -i -E "s/^ATLANTIAN_BUILD=.*/ATLANTIAN_BUILD=${next_build}/" config/release.env
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debian-release.sha256 config/release.env
          git commit -m "chore: refresh Debian trixie metadata (AtlANTian ${DEBIAN_MAJOR}.${next_build})"
          git push origin main
          # Pushes made with GITHUB_TOKEN do not trigger another push workflow.
          # Start the normal release workflow explicitly; it derives the commit
          # hash and creates the immutable release tag itself.
          gh workflow run 'Build and release AtlANTian' --ref main
        env:
          GH_TOKEN: ${{ github.token }}
