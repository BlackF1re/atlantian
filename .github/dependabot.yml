version: 2

# Debian owns userspace package maintenance; Dependabot is intentionally limited
# to GitHub Actions infrastructure. Routine updates are grouped so maintenance
# stays quiet, while security updates can still surface when GitHub flags them.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:17"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
