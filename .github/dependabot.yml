version: 2

# AtlANTian has no language-level dependency manifest of its own; Debian owns
# userspace packages. Dependabot therefore maintains only GitHub Actions
# infrastructure. Routine version updates are grouped to keep maintenance quiet.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Asia/Tomsk"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
