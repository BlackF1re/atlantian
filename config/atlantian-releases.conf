# Release source. Runtime images carry the repository that published them;
# GitHub Actions supplies the current repository. Environment overrides remain
# available for mirrors and tests.
if [ -z "${ATLANTIAN_GITHUB_REPO:-}" ]; then
  if [ -s /usr/lib/atlantian/release-repo ]; then
    ATLANTIAN_GITHUB_REPO=$(cat /usr/lib/atlantian/release-repo)
  elif [ -n "${GITHUB_REPOSITORY:-}" ]; then
    ATLANTIAN_GITHUB_REPO=$GITHUB_REPOSITORY
  else
    ATLANTIAN_GITHUB_REPO=BlackF1re/atlantian
  fi
fi
ATLANTIAN_RELEASE_API=${ATLANTIAN_RELEASE_API:-https://api.github.com}
